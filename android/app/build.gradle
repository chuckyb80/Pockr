plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// --- release signing inputs (begin) -----------------------------------------
// The release keystore is a real secret and never lives in this repo. It is read
// from android/key.properties (gitignored) or from POCKR_* environment variables,
// which is how scripts/build_apk.sh hands it to the Docker build. key.properties
// wins so a local file overrides a stale variable in your shell.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def signingInput = { String property, String envVar ->
    def value = keystoreProperties.getProperty(property) ?: System.getenv(envVar)
    // A blank value counts as missing. Passwords are otherwise used exactly as given.
    return (value != null && !value.trim().isEmpty()) ? value : null
}
def releaseStoreFile     = signingInput('storeFile',     'POCKR_KEYSTORE_FILE')
def releaseStorePassword = signingInput('storePassword', 'POCKR_KEYSTORE_PASSWORD')
def releaseKeyAlias      = signingInput('keyAlias',      'POCKR_KEY_ALIAS')
def releaseKeyPassword   = signingInput('keyPassword',   'POCKR_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
// --- release signing inputs (end) -------------------------------------------

android {
    namespace "com.example.dockerapp"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    aaptOptions {
        // Prevent aapt2 from decompressing .gz assets — we handle decompression at runtime
        // Also skip compression on kernel/initrd (already compressed binaries)
        noCompress "gz", "virt"
    }

    defaultConfig {
        applicationId "com.example.dockerapp"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        // Committed on purpose: a stable signature is what lets `adb install -r` upgrade a
        // debug build in place (ISSUES.md #10). Its password is the public Android default,
        // so anyone can sign with it. It must never sign a release.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "debug"
            keyPassword "android"
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No fallback to the debug config. With no release key the build is stopped by
            // the check below instead of shipping an APK anyone could re-sign.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    packagingOptions {
        jniLibs {
            // Force extraction of native libs to disk so ProcessBuilder can execute them.
            // Without this, AGP 3.6+ keeps libs compressed inside the APK (not on disk).
            useLegacyPackaging true
        }
    }
}

// --- release signing guard (begin) -----------------------------------------
// Fail fast, and say why, when a release APK/AAB is requested without the release key.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /^(assemble|bundle|package).*Release$/
    }
    if (!releaseRequested) {
        return
    }
    if (!hasReleaseSigning) {
        throw new GradleException(
            'Release build needs the release keystore. Set storeFile, storePassword, keyAlias ' +
            'and keyPassword in android/key.properties, or POCKR_KEYSTORE_FILE, ' +
            'POCKR_KEYSTORE_PASSWORD, POCKR_KEY_ALIAS and POCKR_KEY_PASSWORD in the ' +
            'environment. Create a keystore with scripts/make_release_keystore.sh. ' +
            'Release builds are never signed with debug.keystore.')
    }
    if (!file(releaseStoreFile).exists()) {
        throw new GradleException("Release keystore not found: ${releaseStoreFile}")
    }
}
// --- release signing guard (end) --------------------------------------------

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
}
